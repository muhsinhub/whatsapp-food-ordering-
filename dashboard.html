<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .header {
      background: #25D366;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 22px; }
    .refresh-btn {
      background: white;
      color: #25D366;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .refresh-btn:hover { background: #f0f0f0; }
    .stats {
      display: flex;
      gap: 15px;
      padding: 20px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      flex: 1;
      min-width: 120px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .stat-card h2 { font-size: 32px; color: #25D366; }
    .stat-card p { color: #666; font-size: 13px; margin-top: 5px; }
    .orders-section { padding: 0 20px 20px; }
    .orders-section h2 { margin-bottom: 15px; color: #333; }
    .order-card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-left: 4px solid #25D366;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .order-id { font-weight: bold; color: #333; }
    .order-time { color: #999; font-size: 12px; }
    .order-items { color: #555; font-size: 14px; line-height: 1.8; }
    .order-total {
      margin-top: 10px;
      font-weight: bold;
      color: #25D366;
      font-size: 16px;
    }
    .order-phone { color: #999; font-size: 12px; margin-top: 5px; }
    .no-orders {
      text-align: center;
      color: #999;
      padding: 50px;
      font-size: 16px;
    }
    .status-badge {
      background: #e8f5e9;
      color: #25D366;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🍔 QuickBite Dashboard</h1>
  <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
</div>

<div class="stats">
  <div class="stat-card">
    <h2 id="total-orders">0</h2>
    <p>Total Orders</p>
  </div>
  <div class="stat-card">
    <h2 id="total-revenue">R0</h2>
    <p>Total Revenue</p>
  </div>
</div>

<div class="orders-section">
  <h2>📋 Incoming Orders</h2>
  <div id="orders-container">
    <div class="no-orders">Loading orders...</div>
  </div>
</div>

<script>
  async function loadOrders() {
    try {
      const response = await fetch('/orders');
      const data = await response.json();
      const orders = data.orders;

      document.getElementById('total-orders').textContent = orders.length;

      let totalRevenue = 0;
      orders.forEach(order => {
        order.cart.forEach(item => {
          totalRevenue += item.price * item.qty;
        });
      });
      document.getElementById('total-revenue').textContent = `R${totalRevenue}`;

      const container = document.getElementById('orders-container');

      if (orders.length === 0) {
        container.innerHTML = '<div class="no-orders">📭 No orders yet. Share your WhatsApp number to start receiving orders!</div>';
        return;
      }

      container.innerHTML = orders.reverse().map(order => {
        let itemsHtml = order.cart.map(item =>
          `${item.name} x${item.qty} = R${item.price * item.qty}`
        ).join('<br>');

        let total = order.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        let time = new Date(order.time).toLocaleTimeString();

        return `
          <div class="order-card">
            <div class="order-header">
              <span class="order-id">Order #${order.id}</span>
              <span class="status-badge">New</span>
            </div>
            <div class="order-time">⏰ ${time}</div>
            <div class="order-items">${itemsHtml}</div>
            <div class="order-total">Total: R${total}</div>
            <div class="order-phone">📱 ${order.from.replace('whatsapp:', '')}</div>
          </div>
        `;
      }).join('');

    } catch (err) {
      document.getElementById('orders-container').innerHTML =
        '<div class="no-orders">❌ Could not load orders. Try refreshing.</div>';
    }
  }

  loadOrders();
</script>

</body>
</html>
