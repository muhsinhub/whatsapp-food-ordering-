<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #eee;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #25D366;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .logo-text span { color: #25D366; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      background: #e8f5e9;
      color: #25D366;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #25D366;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .refresh-btn {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:hover { background: #2d2d4e; }

    .main { padding: 24px; max-width: 1100px; margin: 0 auto; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border: 1px solid #f0f0f0;
    }

    .stat-label {
      font-size: 12px;
      color: #888;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .stat-value.green { color: #25D366; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .order-count {
      background: #f0f0f0;
      color: #555;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .order-card {
      background: white;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      border: 1px solid #f0f0f0;
      transition: box-shadow 0.2s;
    }

    .order-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

    .order-card.ready {
      border-left: 4px solid #25D366;
      opacity: 0.7;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .order-top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .customer-name {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a2e;
    }

    .order-id {
      font-size: 12px;
      color: #aaa;
      font-weight: 500;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .status-new {
      background: #e8f5e9;
      color: #25D366;
    }

    .status-ready {
      background: #e3f2fd;
      color: #1976d2;
    }

    .order-time {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .order-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .order-left { flex: 1; }

    .order-items {
      font-size: 14px;
      color: #555;
      line-height: 1.9;
      margin-bottom: 8px;
    }

    .order-phone {
      font-size: 12px;
      color: #aaa;
    }

    .order-right {
      text-align: right;
      min-width: 100px;
    }

    .order-total {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
    }

    .order-total-label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .ready-btn {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .ready-btn:hover { background: #25D366; }

    .ready-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .collected-label {
      font-size: 12px;
      color: #25D366;
      font-weight: 600;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    .empty-sub { font-size: 13px; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">QB</div>
    <div class="logo-text">Quick<span>Bite</span></div>
  </div>
  <div class="header-right">
    <div class="live-badge">
      <div class="live-dot"></div>
      Live
    </div>
    <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
  </div>
</div>

<div class="main">
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Orders</div>
      <div class="stat-value" id="total-orders">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Revenue</div>
      <div class="stat-value green" id="total-revenue">—</div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">Incoming Orders</div>
    <div class="order-count" id="order-count">0 orders</div>
  </div>

  <div id="orders-container">
    <div class="loading">Loading orders...</div>
  </div>
</div>

<script>
  async function markReady(orderId, btn) {
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const response = await fetch(`/ready/${orderId}`, { method: 'POST' });
      const data = await response.json();

      if (data.success) {
        btn.textContent = 'Notified';
        btn.style.background = '#25D366';
        const card = btn.closest('.order-card');
        card.classList.add('ready');
        const badge = card.querySelector('.status-badge');
        badge.textContent = 'Ready';
        badge.className = 'status-badge status-ready';
      } else {
        btn.disabled = false;
        btn.textContent = 'Ready for Collection';
        alert('Something went wrong. Please try again.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Ready for Collection';
      alert('Could not send notification. Please try again.');
    }
  }

  async function loadOrders() {
    try {
      const response = await fetch('/orders');
      const data = await response.json();
      const orders = data.orders;

      const total = orders.length;
      const revenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);

      document.getElementById('total-orders').textContent = total;
      document.getElementById('total-revenue').textContent = `R${revenue}`;
      document.getElementById('order-count').textContent = `${total} order${total !== 1 ? 's' : ''}`;

      const container = document.getElementById('orders-container');

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">No orders yet</div>
            <div class="empty-sub">Orders will appear here when customers place them on WhatsApp</div>
          </div>`;
        return;
      }

      container.innerHTML = orders.map(order => {
        const cart = Array.isArray(order.cart) ? order.cart : [];
        const total = order.total || cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const time = order.time ? new Date(order.time).toLocaleString() : '';
        const phone = (order.from || '').replace('whatsapp:', '');
        const items = cart.map(i => `${i.name} x${i.qty} — R${i.price * i.qty}`).join('<br>');
        const name = order.name || 'Unknown';
        const isReady = order.status === 'ready';

        return `
          <div class="order-card ${isReady ? 'ready' : ''}">
            <div class="order-top">
              <div class="order-top-left">
                <div class="customer-name">${name}</div>
                <div class="order-id">Order #${order.id}</div>
                <div class="status-badge ${isReady ? 'status-ready' : 'status-new'}">${isReady ? 'Ready' : 'New'}</div>
              </div>
            </div>
            <div class="order-time">${time}</div>
            <div class="order-body">
              <div class="order-left">
                <div class="order-items">${items}</div>
                <div class="order-phone">${phone}</div>
              </div>
              <div class="order-right">
                <div class="order-total">R${total}</div>
                <div class="order-total-label">Total</div>
                ${isReady
                  ? `<div class="collected-label">Notified</div>`
                  : `<button class="ready-btn" onclick="markReady(${order.id}, this)">Ready for Collection</button>`
                }
              </div>
            </div>
          </div>`;
      }).join('');

    } catch (err) {
      document.getElementById('orders-container').innerHTML =
        '<div class="empty-state"><div class="empty-title">Could not load orders</div><div class="empty-sub">Try refreshing</div></div>';
    }
  }

  loadOrders();
  setInterval(loadOrders, 30000);
</script>

</body>
</html>
